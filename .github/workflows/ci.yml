name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q baseline checkpoint extraction guarded validator ops analytics eval workflow
